[project]
name = "web"
version = "0.1.0"
description = ""
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "flask (>=3.1.2,<4.0.0)",
    "flask-session",
    "flask-sqlalchemy-lite",
    "psycopg2-binary (==2.9.11)",
    "geoalchemy2 (>=0.18.0,<0.19.0)",
    "shapely (>=2.1.2,<3.0.0)",
    "minio (>=7.2.18,<8.0.0)",
    "marshmallow (>=4.1.0,<5.0.0)",
    "pyjwt (>=2.10.1,<3.0.0)",
    "flask-swagger-ui (>=5.21.0,<6.0.0)",
    "apispec[marshmallow] (>=6.8.4,<7.0.0)",
    "apispec-webframeworks (>=1.2.0,<2.0.0)",
    "flask-cors (>=6.0.1,<7.0.0)",
]

[tool.poetry]
packages = [{include = "web", from = "src"}]


[tool.poetry.group.test.dependencies]
pytest = "^8.4.2"

[tool.pyright]
include = ["src"]
exclude = [".venv", "**/__pycache__"]
extraPaths = ["src"]
reportMissingImports = "warning"
reportImportCycles = "none"
pythonVersion = "3.12"

[tool.pylint.MASTER]
init-hook = "import sys; sys.path.append('src')"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"