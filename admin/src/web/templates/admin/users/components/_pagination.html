
{% if users %}
<nav aria-label="Paginación de usuarios">
    <ul class="pagination justify-content-center">
        {% if page > 1 %}
            <li class="page-item">
                <button class="page-link" onclick="goToPage({{ page - 1 }})">
                    <i class="fas fa-chevron-left"></i> Anterior
                </button>
            </li>
        {% endif %}
        
        <li class="page-item active">
            <span class="page-link">Página {{ page }}</span>
        </li>
        
        {% if users|length == 25 %}
            <li class="page-item">
                <button class="page-link" onclick="goToPage({{ page + 1 }})">
                    Siguiente <i class="fas fa-chevron-right"></i>
                </button>
            </li>
        {% endif %}
    </ul>
</nav>

<input type="hidden" id="page_input" value="{{ page }}">

<!-- Información adicional -->
<div class="d-flex justify-content-between align-items-center mt-3">
    <small class="text-muted">
        Mostrando {{ users|length }} de {{ users|length }} usuarios en la página {{ page }}
    </small>
    <small class="text-muted">
        {{ 25 }} registros por página
    </small>
</div>
{% endif %}
