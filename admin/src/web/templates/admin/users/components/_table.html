<!-- Tabla de usuarios -->
<div class="table-responsive">
    <table class="table table-striped table-hover">
        <thead class="thead-dark">
            <tr>
                <th>ID</th>
                <th>Email</th>
                <th>Nombre</th>
                <th>Apellido</th>
                <th>Rol</th>
                <th>Super Admin</th>
                <th>Estado</th>
                <th>Fecha Creación</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% if users %}
                {% for user in users %}
                {% include 'admin/users/components/_user_row.html' %}
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="9" class="text-center">
                        <div class="py-4">
                            <i class="fas fa-users fa-3x text-muted mb-3"></i>
                            <p class="text-muted">No se encontraron usuarios</p>
                            <a href="{{ url_for('admin_users.create_form') }}" class="btn btn-primary">
                                <i class="fas fa-plus"></i> Crear primer usuario
                            </a>
                        </div>
                    </td>
                </tr>
            {% endif %}
        </tbody>
    </table>
</div>
