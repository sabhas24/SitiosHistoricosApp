<section class="table-responsive" aria-labelledby="users-heading">
    <table class="table table-striped table-hover" role="table" aria-label="Lista de usuarios del sistema">
        <thead class="table-dark">
            <tr>
                <th class="d-none d-lg-table-cell">ID</th>
                <th>Email</th>
                <th class="d-none d-md-table-cell">Nombre</th>
                <th class="d-none d-md-table-cell">Apellido</th>
                <th class="d-none d-sm-table-cell">Rol</th>
                <th class="d-none d-lg-table-cell">Super Admin</th>
                <th class="d-none d-sm-table-cell">Estado</th>
                <th class="d-none d-xl-table-cell" style="cursor: pointer;" onclick="toggleDateOrder()">
                    <span class="d-none d-xl-inline">Fecha Creación</span>
                    <span class="d-inline d-xl-none">Fecha</span>
                    <i class="fas fa-sort"></i>
                </th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            {% if users %}
                {% for user in users %}
                {% include 'admin/users/components/_user_row.html' %}
                {% endfor %}
            {% else %}
                <tr>
                    <td colspan="9" class="text-center">
                        <div class="py-4">
                            <i class="fas fa-users fa-2x fa-lg-3x text-muted mb-3 d-block"></i>
                            <p class="text-muted mb-3">No se encontraron usuarios</p>
                            <a href="{{ url_for('admin_users.create_form') }}" class="btn btn-primary btn-sm">
                                <i class="fas fa-plus"></i> Crear primer usuario
                            </a>
                        </div>
                    </td>
                </tr>
            {% endif %}
        </tbody>
    </table>
</section>
