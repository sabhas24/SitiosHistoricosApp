
<div class="card mb-4 filters-container">
    <div class="card-header">
        <h5 class="card-title mb-0">
            <i class="fas fa-filter"></i> Filtros de Búsqueda
        </h5>
    </div>
    <div class="card-body">
        <div class="row">
            <div class="col-md-4">
                <div class="form-group">
                    <label for="email_search">Buscar por Email</label>
                    <div class="input-group">
                        <input type="text" class="form-control" id="email_search" placeholder="Ingrese email del usuario">
                        <div class="input-group-append">
                            <button class="btn btn-primary" type="button" onclick="searchByEmail()">
                                <i class="fas fa-search"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-2">
                <div class="form-group">
                    <label for="filter_type">Filtro</label>
                    <select class="form-control" id="filter_type">
                        <option value="mail">Por Email</option>
                        <option value="role">Por Rol</option>
                        <option value="active">Activos</option>
                        <option value="inactive">Inactivos</option>
                    </select>
                </div>
            </div>
            <div class="col-md-2">
                <div class="form-group">
                    <label for="date_order">Orden</label>
                    <select class="form-control" id="date_order">
                        <option value="desc">Recientes</option>
                        <option value="asc">Antiguos</option>
                    </select>
                </div>
            </div>

        </div>
    </div>
</div>
