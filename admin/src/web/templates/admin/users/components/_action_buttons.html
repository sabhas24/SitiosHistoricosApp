
<div class="btn-group btn-group-sm d-flex flex-nowrap" role="group">
    <a href="{{ url_for('admin_users.edit_form', user_id=user.id) }}" 
       class="btn btn-outline-primary" title="Editar">
        <i class="fas fa-edit"></i>
    </a>
    
    {% if user.is_super_admin or user.role.name == 'admin' %}
    <button type="button" class="btn btn-outline-secondary" disabled title="Protegido">
        <i class="fas fa-shield-alt"></i>
    </button>
    {% else %}
    <button type="button" class="btn btn-outline-{{ 'success' if not user.enabled else 'warning' }} toggle-status-btn" 
            data-user-id="{{ user.id }}" 
            data-enabled="{{ user.enabled|lower }}" 
            title="{{ 'Activar' if not user.enabled else 'Bloquear' }}">
        <i class="fas fa-{{ 'unlock' if not user.enabled else 'lock' }}"></i>
    </button>
    
    <button type="button" class="btn btn-outline-danger delete-user-btn" 
            data-user-id="{{ user.id }}" 
            data-user-name="{{ user.name }}" 
            title="Eliminar">
        <i class="fas fa-trash"></i>
    </button>
    {% endif %}
</div>
