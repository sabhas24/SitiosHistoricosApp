<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Mi Sitio{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/layout.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/topBar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/sidebar.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/footer.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/home.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/forms.css') }}">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
  {% include 'topBar.html' %}
  
  <div class="layout-container">
    {% if is_authenticated() %}
      {% include 'sidebar.html' %}
    {% endif %}
    
    <main {% if is_authenticated() %}class="with-sidebar"{% endif %}>
        {% block content %}
        {% endblock %}
    </main>
  </div>
  
  {% include 'footer.html' %}
  <script>
    (function(){
      const sidebar = document.getElementById('sidebar');
      const toggle = document.getElementById('sidebarToggle');
      if(!sidebar || !toggle) return;

      const KEY = 'sidebar:minimized';
      const applyState = () => {
        const minimized = localStorage.getItem(KEY) === '1';
        sidebar.classList.toggle('minimized', minimized);
        if(minimized) {
          toggle.textContent = '»';
          document.querySelector('main.with-sidebar')?.classList.add('sidebar-collapsed');
        } else {
          toggle.textContent = '«';
          document.querySelector('main.with-sidebar')?.classList.remove('sidebar-collapsed');
        }
      };
      applyState();

      toggle.addEventListener('click', () => {
        
        if(window.matchMedia('(max-width: 900px)').matches) {
          sidebar.classList.toggle('active');
          return;
        }
        const minimized = sidebar.classList.toggle('minimized');
        localStorage.setItem(KEY, minimized ? '1' : '0');
        applyState();
      });

      
      document.addEventListener('click', (e) => {
        if(!window.matchMedia('(max-width: 900px)').matches) return;
        if(!sidebar.contains(e.target) && e.target !== toggle) {
          sidebar.classList.remove('active');
        }
      });
    })();

    
    (function(){
      const flashes = document.querySelectorAll('.flashes li');
      flashes.forEach(li => {
        const timeout = setTimeout(() => {
          li.classList.add('removing');
          setTimeout(() => li.remove(), 500);
        }, 3000); 
        li.addEventListener('click', () => { clearTimeout(timeout); li.classList.add('removing'); setTimeout(()=>li.remove(), 500); });
      });
    })();
  </script>
</body>
</html>
